
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO ARENA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d18;color:white;
 font-family:Arial;text-align:center;
 padding:25px 15px;
}
h1{color:#35d9ff;font-size:35px}
.panel{
 max-width:400px;margin:auto;
 background:#151e30;padding:22px;
 border-radius:20px;
}
select,button{
 padding:13px;border:0;border-radius:10px;
 font-size:16px;margin:7px;
}
select{background:#26344d;color:white}
.board{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:22px auto;max-width:300px;
}
.cell{
 height:90px;background:#26344d;
 border-radius:14px;font-size:48px;
 font-weight:bold;color:#35d9ff;
 display:flex;align-items:center;
 justify-content:center;cursor:pointer;
}
.cell.o{color:#ff668b}
#status{font-size:19px;margin:15px}
button{background:#20b9e9;color:#07111d;font-weight:bold}
</style>
</head>
<body>
<h1>⚡ XO ARENA</h1>
<div class="panel">
<h3>BOT BILAN O'YNASH</h3>
<select id="level">
<option value="easy">Oson</option>
<option value="medium">O'rta</option>
<option value="hard">Qiyin</option>
</select>
<div id="status">Sizning navbatingiz: X</div>
<div class="board" id="board"></div>
<button onclick="restart()">🔄 Qayta boshlash</button>
</div>

<script>
let cells=Array(9).fill("");
let gameOver=false;
let human="X", bot="O";

function draw(){
 const board=document.getElementById("board");
 board.innerHTML="";
 cells.forEach((v,i)=>{
  let d=document.createElement("div");
  d.className="cell "+(v==="O"?"o":"");
  d.textContent=v;
  d.onclick=()=>play(i);
  board.appendChild(d);
 });
}

function winner(b,p){
 const lines=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
 ];
 return lines.some(line=>line.every(i=>b[i]===p));
}

function finish(){
 if(winner(cells,human)){
  document.getElementById("status").textContent="🎉 Siz yutdingiz!";
  gameOver=true;return true;
 }
 if(winner(cells,bot)){
  document.getElementById("status").textContent="🤖 Bot yutdi!";
  gameOver=true;return true;
 }
 if(cells.every(x=>x)){
  document.getElementById("status").textContent="🤝 Durrang!";
  gameOver=true;return true;
 }
 return false;
}

function play(i){
 if(gameOver||cells[i])return;
 cells[i]=human;draw();
 if(finish())return;
 document.getElementById("status").textContent="Bot o'ylayapti...";
 setTimeout(botMove,400);
}

function findMove(p){
 for(let i=0;i<9;i++){
  if(!cells[i]){
   cells[i]=p;
   let won=winner(cells,p);
   cells[i]="";
   if(won)return i;
  }
 }
 return -1;
}

function minimax(b,isBot){
 if(winner(b,bot))return 10;
 if(winner(b,human))return -10;
 if(b.every(x=>x))return 0;
 let scores=[];
 for(let i=0;i<9;i++){
  if(!b[i]){
   b[i]=isBot?bot:human;
   scores.push(minimax(b,!isBot));
   b[i]="";
  }
 }
 return isBot?Math.max(...scores):Math.min(...scores);
}

function botMove(){
 if(gameOver)return;
 let move=-1;
 let level=document.getElementById("level").value;

 if(level==="easy"){
  let a=cells.map((v,i)=>v===""?i:-1).filter(i=>i>=0);
  move=a[Math.floor(Math.random()*a.length)];
 }
 else if(level==="medium"){
  move=findMove(bot);
  if(move<0)move=findMove(human);
  if(move<0){
   let a=cells.map((v,i)=>v===""?i:-1).filter(i=>i>=0);
   move=a[Math.floor(Math.random()*a.length)];
  }
 }
 else{
  let best=-Infinity;
  for(let i=0;i<9;i++){
   if(!cells[i]){
    cells[i]=bot;
    let score=minimax(cells,false);
    cells[i]="";
    if(score>best){best=score;move=i;}
   }
  }
 }
 if(move>=0)cells[move]=bot;
 draw();
 if(!finish())
  document.getElementById("status").textContent="Sizning navbatingiz: X";
}

function restart(){
 cells=Array(9).fill("");
 gameOver=false;
 document.getElementById("status").textContent="Sizning navbatingiz: X";
 draw();
}
draw();
</script>
</body>
</html>
